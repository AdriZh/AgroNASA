name: Test & deploy to GitHub Pages

# Pages is served from the `gh-pages` branch (Settings → Pages → "Deploy from a branch").
# Every push to main runs the tests, builds the static site and publishes `dist/` to gh-pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing at workflow level; the one job gets only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the built site to the gh-pages branch
    steps:
      # actions pinned to full commit SHAs (tag in the comment) so a moved tag cannot change what runs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # the publish step passes the token explicitly
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish dist/ to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # via env, never interpolated into the script text
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Verify the live site serves this build (no 404 assets)
        run: |
          URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          WANT=$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)
          echo "Waiting for $URL to serve $WANT"
          for i in $(seq 1 40); do
            if curl -fsS "$URL" | grep -q "$WANT"; then echo "live after ~$(((i-1)*15))s"; break; fi
            [ "$i" = 40 ] && { echo "::error::live site did not update"; exit 1; }
            sleep 15
          done
          for a in $(grep -o '\./assets/[^"]*' dist/index.html); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL${a#./}"); echo "$code $a"; [ "$code" = 200 ] || exit 1
          done
