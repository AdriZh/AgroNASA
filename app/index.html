<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-START-->
<title>Fieldwise Crop Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Crop rotation planning from 25 years of NASA POWER data, with a validated next-season outlook.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an analytical workspace, max 1160px. Header with data context, a 3-part stepper, then panels of charts and tables.
   Charts follow one system: hairline grid, 2px lines, rounded data-ends, tooltips, text in ink tokens. */
:root {
  --bg: #f4f6f5; --surface: #ffffff; --surface-2: #f8faf9; --sunken: #eef2f0;
  --ink: #142019; --ink-2: #47534c; --muted: #76817b; --line: #dde3df; --grid: #e7ebe8; --axis: #c3cbc6;
  --brand: #1d6a43; --brand-ink: #ffffff; --brand-wash: #e4f0e8;
  --water: #2a78d6; --water-wash: #dcebfb; --et: #142019; --temp: #eb6834; --temp-band: rgba(235,104,52,0.14);
  --soil: #8a5a2b; --soil-wash: #efe3d4; --snow: #e2ebf3;
  --good: #1b7f2a; --ok: #a86f00; --bad: #c43a3a; --good-fill: #0ca30c; --ok-fill: #eda100; --bad-fill: #d03b3b;
  --f-cereal: #eda100; --f-legume: #1baf7a; --f-brassica: #6250d6; --f-aster: #eb6834; --f-flax: #e87ba4;
  --focus: #2a78d6;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412; --surface: #171d1a; --surface-2: #1b221e; --sunken: #131916;
    --ink: #e9efeb; --ink-2: #bcc6c0; --muted: #8b968f; --line: #2b332e; --grid: #252c28; --axis: #3a433e;
    --brand: #47b57a; --brand-ink: #08130d; --brand-wash: #1a2d22;
    --water: #3987e5; --water-wash: #182a40; --et: #e9efeb; --temp: #d95926; --temp-band: rgba(217,89,38,0.2);
    --soil: #c79563; --soil-wash: #3a2b1d; --snow: #233140;
    --good: #4cc061; --ok: #e3a93a; --bad: #ec6b6b; --good-fill: #0ca30c; --ok-fill: #c98500; --bad-fill: #e66767;
    --f-cereal: #c98500; --f-legume: #199e70; --f-brassica: #9085e9; --f-aster: #d95926; --f-flax: #d55181;
    --focus: #8fc0ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #171d1a; --surface-2: #1b221e; --sunken: #131916;
  --ink: #e9efeb; --ink-2: #bcc6c0; --muted: #8b968f; --line: #2b332e; --grid: #252c28; --axis: #3a433e;
  --brand: #47b57a; --brand-ink: #08130d; --brand-wash: #1a2d22;
  --water: #3987e5; --water-wash: #182a40; --et: #e9efeb; --temp: #d95926; --temp-band: rgba(217,89,38,0.2);
  --soil: #c79563; --soil-wash: #3a2b1d; --snow: #233140;
  --good: #4cc061; --ok: #e3a93a; --bad: #ec6b6b; --good-fill: #0ca30c; --ok-fill: #c98500; --bad-fill: #e66767;
  --f-cereal: #c98500; --f-legume: #199e70; --f-brassica: #9085e9; --f-aster: #d95926; --f-flax: #d55181;
  --focus: #8fc0ff; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px; }
.wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance; font-weight: 600; letter-spacing: -0.005em; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1rem; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num, td.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 0.875rem; } .xs { font-size: 0.78rem; }

header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 16px 14px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand svg { width: 30px; height: 30px; }
.brand b { font-size: 1.15rem; display: block; line-height: 1.1; }
.brand small { color: var(--muted); font-size: 0.82rem; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; min-height: 40px; padding: 7px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.btn:hover { border-color: var(--axis); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
.btn.lg { min-height: 48px; padding: 10px 20px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; min-height: 40px; padding: 7px 14px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }

.stepper { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.stepper button { border: 0; border-right: 1px solid var(--line); background: transparent; padding: 12px 14px; text-align: left; cursor: pointer; display: flex; gap: 10px; align-items: center; min-height: 56px; }
.stepper button:last-child { border-right: 0; }
.stepper .n { font-family: var(--mono); font-size: 0.8rem; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--axis); display: grid; place-items: center; flex: none; }
.stepper button[aria-current="step"] { background: var(--brand-wash); font-weight: 600; box-shadow: inset 0 -3px 0 var(--brand); }
.stepper button[aria-current="step"] .n { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.stepper button:disabled { color: var(--muted); cursor: not-allowed; }
@media (max-width: 600px) { .stepper button { flex-direction: column; text-align: center; gap: 4px; font-size: 0.82rem; padding: 10px 6px; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel-head { display: flex; flex-direction: column; gap: 4px; }
.take { color: var(--ink-2); font-size: 0.95rem; max-width: 80ch; }
.cols { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); }
.cols > * { min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.sites { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.site { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 12px 14px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.site b { font-weight: 600; }
.site[aria-pressed="true"] { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); background: var(--brand-wash); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-weight: 600; font-size: 0.9rem; }
input[type=number], select { min-height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 8px 10px; max-width: 100%; }
.coords { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.coords input { width: 120px; }
.status { border-radius: 8px; padding: 9px 12px; background: var(--surface-2); border: 1px solid var(--line); font-size: 0.92rem; }
.status.err { border-color: var(--bad); color: var(--bad); }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
th { font-family: var(--mono); font-weight: 500; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.good { color: var(--good); } .pill.risky { color: var(--ok); } .pill.poor { color: var(--bad); }
.fam { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.fam i, .chip i, .seq i, .legend i.sq { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.minibar { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.minibar span { width: 80px; height: 8px; background: var(--sunken); border-radius: 4px; overflow: hidden; display: inline-block; }
.minibar span i { display: block; height: 100%; border-radius: 4px; background: var(--brand); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; min-height: 38px; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--sunken); font-weight: 600; }
.chip[aria-pressed="false"] { color: var(--muted); }
.form-grid { display: grid; gap: 16px 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
.form-grid > * { min-width: 0; }

.chart { width: 100%; position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--sans); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.82rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; }
.legend i.ln { height: 2px; }

.rec { border: 1px solid var(--brand); background: var(--brand-wash); border-radius: 12px; padding: 18px 20px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 820px) { .rec { grid-template-columns: 1fr; } }
.seq { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.seq .s { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.seq .s small { color: var(--muted); font-family: var(--mono); font-size: 0.75rem; }
.seq .arr { color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 420px) { .kpis { grid-template-columns: 1fr; } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .v { font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi .k { font-size: 0.78rem; color: var(--muted); line-height: 1.3; }
.kpi .d { font-size: 0.78rem; font-family: var(--mono); }
.d.up { color: var(--good); } .d.down { color: var(--bad); } .d.flat { color: var(--muted); }

.cmp th.plan-h { text-transform: none; letter-spacing: 0; font-family: var(--sans); font-size: 0.9rem; color: var(--ink); font-weight: 600; vertical-align: top; min-width: 190px; }
.cmp th.plan-h.sel, .cmp td.sel { background: var(--brand-wash); }
.cmp th.plan-h.sel { box-shadow: inset 0 3px 0 var(--brand); }
.cmp td:first-child { color: var(--ink-2); min-width: 150px; }
.badge { display: inline-block; font-size: 0.68rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--brand); border: 1px solid var(--brand); border-radius: 4px; padding: 0 5px; margin-bottom: 4px; }
.formula { font-family: var(--mono); font-size: 0.85rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: nowrap; }
.probrow { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 0.86rem; }
.probbar { display: flex; height: 26px; border-radius: 6px; overflow: hidden; gap: 2px; }
.probbar span { display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--mono); font-size: 0.75rem; min-width: 0; overflow: hidden; }
.p-good { background: var(--good-fill); } .p-ok { background: var(--ok-fill); color: #0b0b0b !important; } .p-bad { background: var(--bad-fill); }
ul.rat { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 8px; }
ul.rat li::marker { color: var(--brand); }
details.methods summary { cursor: pointer; font-weight: 600; min-height: 36px; display: flex; align-items: center; }
details.methods ul { margin: 6px 0 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; color: var(--ink-2); }
.tip { position: absolute; z-index: 40; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 0.8rem; line-height: 1.4; padding: 6px 9px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 50; max-width: calc(100% - 32px); }
footer { color: var(--muted); font-size: 0.8rem; text-align: center; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--brand)"/><path d="M6 23h20M6 18h20" stroke="var(--brand-ink)" stroke-width="1.6" stroke-linecap="round" opacity=".5"/><path d="M16 26V11m0 0c0-3 3-5 6-5 0 3-3 5-6 5Zm0 4c0-3-3-5-6-5 0 3 3 5 6 5Z" stroke="var(--brand-ink)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>Fieldwise</b><small data-t="tagline"></small></div>
    </div>
    <button class="btn" id="listen" type="button" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10L5 10H2z" fill="currentColor"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6 6 0 0 1 0 9" stroke="currentColor" fill="none" stroke-width="1.4" stroke-linecap="round"/></svg><span data-t="readAloud"></span></button>
    <div class="seg" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="ru" aria-pressed="false">RU</button></div>
  </header>

  <nav class="stepper" aria-label="Steps">
    <button type="button" data-step="1" aria-current="step"><span class="n">1</span><span data-t="step1"></span></button>
    <button type="button" data-step="2"><span class="n">2</span><span data-t="step2"></span></button>
    <button type="button" data-step="3"><span class="n">3</span><span data-t="step3"></span></button>
  </nav>

  <!-- STEP 1 -->
  <section id="s1" class="stack">
    <div class="cols">
      <div class="panel">
        <div class="panel-head"><h2 data-t="locTitle"></h2><p class="take" data-t="locHelp"></p></div>
        <div class="sites" id="presets"></div>
        <div class="coords">
          <div class="field"><label for="lat" data-t="lat"></label><input id="lat" type="number" step="0.01" min="-60" max="70" value="52.60" inputmode="decimal"></div>
          <div class="field"><label for="lon" data-t="lon"></label><input id="lon" type="number" step="0.01" min="-180" max="180" value="69.90" inputmode="decimal"></div>
          <button class="btn" id="fetch" type="button"><span data-t="getData"></span></button>
          <button class="btn" id="geo" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.5" fill="currentColor"/><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 0v2.5M8 13.5V16M0 8h2.5M13.5 8H16" stroke="currentColor" stroke-width="1.4"/></svg><span data-t="useMyLocation"></span></button>
        </div>
        <p class="status" id="status1" hidden></p>
      </div>
      <div class="panel" id="dataPanel" hidden></div>
    </div>
    <div class="panel" id="climPanel" hidden></div>
    <div class="nav"><span></span><button class="btn primary lg" type="button" id="to2" disabled><span data-t="next"></span> →</button></div>
  </section>

  <!-- STEP 2 -->
  <section id="s2" class="stack" hidden>
    <div class="panel">
      <div class="panel-head"><h2 data-t="profileTitle"></h2><p class="take" data-t="profileHelp"></p></div>
      <div class="form-grid" id="profile"></div>
      <div class="field"><span class="lbl" data-t="cropsAvail"></span><div class="chips" id="canGrow"></div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2 data-t="suitTitle"></h2><p class="take" data-t="suitHelp"></p></div>
      <div class="tbl-wrap" id="suit"></div>
    </div>
    <div class="nav"><button class="btn lg" type="button" data-goto="1">← <span data-t="back"></span></button><button class="btn primary lg" type="button" id="make"><span data-t="makePlan"></span> →</button></div>
  </section>

  <!-- STEP 3 -->
  <section id="s3" class="stack" hidden>
    <div class="rec" id="rec"></div>
    <div class="panel">
      <div class="row" style="justify-content:space-between"><h2 data-t="compTitle"></h2><div class="seg" role="group" id="scen"></div></div>
      <p class="muted small" data-t="scenNote"></p>
      <div class="tbl-wrap" id="cmp"></div>
    </div>
    <div class="cols">
      <div class="panel"><div class="panel-head"><h3 data-t="distTitle"></h3><p class="take small" data-t="distTake"></p></div><div class="chart" id="chDist"></div></div>
      <div class="panel"><div class="panel-head"><h3 data-t="calTitle"></h3><p class="take small" data-t="calTake"></p></div><div class="chart" id="chCal"></div><div class="legend" id="calLegend"></div></div>
    </div>
    <div class="panel" id="fcPanel"></div>
    <div class="cols">
      <div class="panel"><h3 data-t="whyTitle"></h3><ul class="rat" id="why"></ul></div>
      <div class="panel"><h3 data-t="checkTitle"></h3><ul class="rat"><li data-t="check1"></li><li data-t="check2"></li><li data-t="check3"></li><li data-t="check4"></li></ul><div class="row"><button class="btn" id="copy" type="button"><span data-t="copy"></span></button></div></div>
    </div>
    <div class="panel"><details class="methods"><summary data-t="methodsTitle"></summary><ul id="methods"></ul></details></div>
    <div class="nav"><button class="btn lg" type="button" data-goto="2">← <span data-t="back"></span></button><span></span></div>
  </section>

  <footer>Fieldwise · NASA POWER (MERRA-2, CERES) · ISRIC SoilGrids · FAO-56 / FAO-33 · screening estimates for discussion with a local agronomist</footer>
</div>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="data/presets.js"></script>
<script src="crops.js"></script>
<script src="i18n.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
<!--ARTIFACT-END-->
</body>
</html>
